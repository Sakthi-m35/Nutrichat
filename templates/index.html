<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ chatbot_title }}</title>
<style>
  :root {
    --bg: #0f1414;
    --panel: #161d1c;
    --panel-2: #1d2624;
    --accent: #4caf7d;
    --accent-2: #2f8f5f;
    --text: #eef2f0;
    --text-dim: #9fb0aa;
    --bubble-user: #2f8f5f;
    --bubble-bot: #212b29;
    --border: #2a3432;
    --error: #e0665c;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, #17201e 0%, #0c1110 70%);
    color: var(--text);
  }

  .app {
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 4px 14px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  header .titles h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  header .titles p {
    margin: 2px 0 0;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .status-dot {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .status-dot span.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
  }

  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 4px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    gap: 10px;
    max-width: 100%;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { justify-content: flex-end; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: 0.93rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-width: 78%;
  }

  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #eafff2;
    border-bottom-right-radius: 4px;
  }

  .msg-row.assistant .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg-row.assistant .avatar {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .bubble.error {
    background: rgba(224, 102, 92, 0.12);
    border: 1px solid var(--error);
    color: #ffd4d0;
  }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form#chat-form {
    display: flex;
    gap: 10px;
    padding: 14px 4px 20px;
    border-top: 1px solid var(--border);
    background: linear-gradient(to top, #0f1414 60%, transparent);
  }

  #user-input {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.93rem;
    font-family: inherit;
    max-height: 120px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #user-input:focus { border-color: var(--accent); }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    color: #08130d;
    font-weight: 600;
    border-radius: 14px;
    padding: 0 20px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #send-btn:not(:disabled):active { transform: scale(0.97); }

  .welcome {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 30px 20px;
    line-height: 1.6;
  }

  .welcome strong { color: var(--text); }

  #chat-area::-webkit-scrollbar { width: 6px; }
  #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  @media (max-width: 480px) {
    .bubble { max-width: 86%; }
    header .titles h1 { font-size: 1rem; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🥗</div>
      <div class="titles">
        <h1>{{ chatbot_title }}</h1>
        <p>Your personal nutrition & healthy habits assistant</p>
      </div>
      <div class="status-dot"><span class="dot"></span>Online</div>
    </header>

    <div id="chat-area">
      <div class="welcome">
        Hi! I'm <strong>{{ chatbot_title }}</strong>. Ask me about nutrition,
        healthy eating, or building better daily habits — I'm happy to help.
      </div>
    </div>

    <form id="chat-form" autocomplete="off">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask about nutrition, meals, or healthy habits..."
        maxlength="4000"
        required
      ></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const chatArea = document.getElementById('chat-area');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Per-tab conversation history, kept client-side so each user/session
    // has independent memory. Sent to the backend with every request.
    let history = [];
    let isSending = false;

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      if (role === 'assistant') {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '🥗';
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(bubble);

      chatArea.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function addError(text) {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '⚠️';
      row.appendChild(avatar);

      const bubble = document.createElement('div');
      bubble.className = 'bubble error';
      bubble.textContent = text;
      row.appendChild(bubble);

      chatArea.appendChild(row);
      scrollToBottom();
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'msg-row assistant';
      row.id = 'typing-row';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🥗';
      row.appendChild(avatar);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      bubble.appendChild(typing);
      row.appendChild(bubble);

      chatArea.appendChild(row);
      scrollToBottom();
    }

    function removeTyping() {
      const row = document.getElementById('typing-row');
      if (row) row.remove();
    }

    async function sendMessage(message) {
      isSending = true;
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history }),
        });

        let data;
        try {
          data = await res.json();
        } catch (e) {
          throw new Error('Unexpected response from server.');
        }

        removeTyping();

        if (!res.ok) {
          const errMsg = (data && data.error) || 'Something went wrong. Please try again.';
          addError(errMsg);
          return;
        }

        const reply = data.reply || "Sorry, I didn't get a response. Please try again.";
        addMessage('assistant', reply);
        history.push({ role: 'assistant', content: reply });
      } catch (err) {
        removeTyping();
        addError('Could not reach the server. Please check your connection and try again.');
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (isSending) return;

      const message = input.value.trim();
      if (!message) return;

      addMessage('user', message);
      history.push({ role: 'user', content: message });

      input.value = '';
      input.style.height = 'auto';
      sendMessage(message);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    input.focus();
  </script>
</body>
</html>
